[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raim"
version = "0.1.0"
description = "RAIM: Robust Aggregation of Inexpensive Models -- evaluation toolkit"
requires-python = ">=3.12"
# requirements-core.txt pins the exact versions of the no-GPU environment; numpy is
# only bounded below here, because `pip install vllm` replaces it with the release
# vLLM supports, and every check passes under either.
dependencies = ["numpy>=2.3", "scikit-learn==1.9.0", "datasets==5.0.0"]

[tool.setuptools]
packages = ["raim"]

